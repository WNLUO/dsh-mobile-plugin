panel.onboarding.connectRelay":`连接中转`,"panel.onboarding.firewallTitle":`检查防火墙`,"panel.onboarding.firewallIntro":`手机连不上这台电脑的直连端口时，多半是电脑这边把端口挡了。直连默认端口`,"panel.onboarding.firewallIntroTail":`（首页「局域网直连」里可以改），下面按系统查。`,"panel.onboarding.copiedOk":`已复制，粘贴给你的 AI 就行。`,"panel.onboarding.copiedFailed":`复制失败，可以手动选中内容复制。`,"panel.onboarding.gotIt":`知道了`,"panel.onboarding.lanDialogTitle":`选择局域网地址`,"panel.onboarding.lanDialogHint":`手机先试选中的这条，其余继续排在后面兜底。`,"panel.onboarding.lanGroupA11y":`局域网地址`,"panel.onboarding.lan":`局域网`,"panel.onboarding.copyPromptHint":`点我复制内容，让自己的 AI 去检查`,"panel.onboarding.copyPrompt":`复制这段排查提示词`,"panel.onboarding.linuxStep1":`1. 看防火墙状态（firewalld 或 ufw，装哪个查哪个）：`,"panel.onboarding.linuxStep2":`2. 放行直连端口：`,"panel.onboarding.linuxStep3":`3. 云服务器还要去服务商控制台的安全组里放行同一个端口 —— 这台机器上查不到。`,"panel.onboarding.macStep1":`1. 看应用防火墙是不是开着：`,"panel.onboarding.macStep2":`2. 开着的话，在「系统设置 → 网络 → 防火墙 → 选项」里把 DSH / node 设成「允许传入连接」；排查时可以整个关掉：`,"panel.onboarding.macStep3":`3. 同一 Wi-Fi 还连不上：确认手机和电脑真在同一个网段，别连到访客网络。`,"panel.onboarding.winStep1":`1. 在 PowerShell（管理员）里看防火墙配置文件：`,"panel.onboarding.winStep2":`2. 放行直连端口：`,"panel.onboarding.winStep3":`3. 如果以前给 node 配过拒绝规则，记得把那条 Block 删掉；网络类型选「专用」而不是「公用」。`,"panel.onboarding.prompt.intro":`帮我排查一个问题。`,"panel.onboarding.prompt.situation":`我的情况：电脑上装了 DSH（DeepSeek Harness）的移动端插件，手机 App 通过局域网直连连不上这台电脑。`,"panel.onboarding.prompt.address":`手机上填的地址是这台电脑的局域网地址加端口（具体的地址和端口你需要到移动端插件的那个网页里看，注意是局域网地址）。`,"panel.onboarding.prompt.guess":`电脑这边显示插件已经在监听，但手机连不上。我判断是电脑的防火墙（或者云服务器的安全组）把这个端口挡了。`,"panel.onboarding.prompt.ask":`请你：`,"panel.onboarding.prompt.ask1":`1. 先确认我的系统是 Linux、macOS 还是 Windows（不确定就问我，或者告诉我怎么确认）。`,"panel.onboarding.prompt.ask2":`2. 按属于我这一套的步骤逐条检查，告诉我那个端口现在通不通、卡在哪一步。`,"panel.onboarding.prompt.ask3":`3. 给出具体该执行的命令或点击路径，把端口放行；需要管理员权限的地方明确说明。`,"panel.onboarding.prompt.ask4":`4. 最后告诉我怎么验证已经通了（比如用哪条命令从本机、从手机分别确认）。`,"panel.onboarding.prompt.extra":`补充：如果这台电脑是云服务器，服务商控制台里的安全组/防火墙也要放行同一个端口，这一项在本机查不到。`,"panel.onboarding.relayPlaceholder":`https://你的中转域名`},"zh-Hant":{"panel.onboarding.title":`用行動裝置連上這台 DSH`,"panel.onboarding.statusFailed":`讀不到外掛狀態`,"panel.onboarding.stepFailed":`這一步沒有成功`,"panel.onboarding.qrAfterRelay":`填好下面的中轉位址後`,"panel.onboarding.qrAfterRelayLine2":`這裡才會產生 QR 碼`,"panel.onboarding.qrAfterAddress":`這個位址連上之後，這裡才會產生 QR 碼`,"panel.onboarding.noQr":`沒取得 QR 碼`,"panel.onboarding.preview":`這是依你填的位址產生的預覽，點「進入外掛」才會把這個位址存進設定。`,"panel.onboarding.relayNotConnected":`中轉還沒連上，連上之後掃碼才有用。`,"panel.onboarding.direct":`直連`,"panel.onboarding.thisAddress":`這個位址`,"panel.onboarding.lanFailed":`沒能開始直連`,"panel.onboarding.relayFailed":`中轉沒連上`,"panel.onboarding.lanErrorWithPort":`{error}（連接埠可能被佔用，到主頁的「區域網路直連」裡換一個。）`,"panel.onboarding.lanNoStart":`直連沒起來，連接埠可能被別的程式佔用。`,"panel.onboarding.tunnelErrorHint":`{error}（檢查中轉位址填對沒有、那台中轉是不是在跑。）`,"panel.onboarding.tunnelNoStart":`通道沒建起來，檢查中轉位址。`,"panel.onboarding.pickAddress":`手機連哪條位址`,"panel.onboarding.relayAddressHint":`中轉位址`,"panel.onboarding.recheckSaved":`這台機器正在用的中轉位址 {url} 現在連不上，先確認那台中轉在不在跑。`,"panel.onboarding.relayNoAnswer":`中轉位址 {value} 上沒有中轉在應答。確認網域名稱寫對、那台 dsh-relay 在執行。`,"panel.onboarding.relayNoAnswerUnsaved":`中轉位址 {value} 上沒有中轉在應答，設定沒改。確認網域名稱寫對、那台 dsh-relay 在執行。`,"panel.onboarding.probe.empty":`還沒填位址`,"panel.onboarding.probe.busy":`檢查中`,"panel.onboarding.probe.ok":`連得通，還沒存進設定`,"panel.onboarding.probe.failed":`連不上`,"panel.onboarding.probe.idle":`還沒檢查`,"panel.onboarding.probe.okWithHint":`這個位址連得通，QR 碼已依它產生（還沒存進設定）。`,"panel.onboarding.checkFirewall":`連不上？檢查防火牆`,"panel.onboarding.lanDirect":`區域網路直連`,"panel.onboarding.chooseAddress":`選擇位址`,"panel.onboarding.publicRelay":`公用中轉`,"panel.onboarding.publicRelayTemporary":`建議臨時使用`,"panel.onboarding.ownRelay":`自建中轉`,"panel.onboarding.githubRepo":`GitHub 儲存庫`,"panel.onboarding.currentLan":`目前選擇的區域網路位址`,"panel.onboarding.public":`公網`,"panel.onboarding.ipv6More":`另有 {count} 條 IPv6 位址，手機依實測擇優`,"panel.onboarding.collapse":`收合`,"panel.onboarding.expand":`展開`,"panel.onboarding.relayListTitle":`公用中轉位址（依實測耗時排）`,"panel.onboarding.probing":`測速中…`,"panel.onboarding.autoBest":`自動優選`,"panel.onboarding.autoBestHint":`取最快的那條`,"panel.onboarding.probeUnreachable":`測不通`,"panel.onboarding.check":`檢查`,"panel.onboarding.enterPlugin":`進入外掛`,"panel.onboarding.connecting":`正在連線…`,"panel.onboarding.fixFirst":`先解決上面的問題`,"panel.onboarding.fillRelayFirst":`先填中轉位址`,"panel.onboarding.opening":`正在開啟…`,"panel.onboarding.openDirect":`開啟直連`,"panel.onboarding.connectRelay":`連線中轉`,"panel.onboarding.firewallTitle":`檢查防火牆`,"panel.onboarding.firewallIntro":`手機連不上這台電腦的直連連接埠時，多半是電腦這邊把連接埠擋了。直連預設連接埠`,"panel.onboarding.firewallIntroTail":`（首頁「區域網路直連」裡可以改），下面依系統查。`,"panel.onboarding.copiedOk":`已複製，貼給你的 AI 就行。`,"panel.onboarding.copiedFailed":`複製失敗，可以手動選取內容複製。`,"panel.onboarding.gotIt":`知道了`,"panel.onboarding.lanDialogTitle":`選擇區域網路位址`,"panel.onboarding.lanDialogHint":`手機先試選中的這條，其餘繼續排在後面兜底。`,"panel.onboarding.lanGroupA11y":`區域網路位址`,"panel.onboarding.lan":`區域網路`,"panel.onboarding.copyPromptHint":`點我複製內容，讓自己的 AI 去檢查`,"panel.onboarding.copyPrompt":`複製這段排查提示詞`,"panel.onboarding.linuxStep1":`1. 看防火牆狀態（firewalld 或 ufw，裝哪個查哪個）：`,"panel.onboarding.linuxStep2":`2. 放行直連連接埠：`,"panel.onboarding.linuxStep3":`3. 雲端伺服器還要去服務商主控台的安全群組裡放行同一個連接埠 —— 這台機器上查不到。`,"panel.onboarding.macStep1":`1. 看應用程式防火牆是不是開著：`,"panel.onboarding.macStep2":`2. 開著的話，在「系統設定 → 網路 → 防火牆 → 選項」裡把 DSH / node 設成「允許傳入連線」；排查時可以整個關掉：`,"panel.onboarding.macStep3":`3. 同一 Wi-Fi 還連不上：確認手機和電腦真在同一個網段，別連到訪客網路。`,"panel.onboarding.winStep1":`1. 在 PowerShell（系統管理員）裡看防火牆設定檔：`,"panel.onboarding.winStep2":`2. 放行直連連接埠：`,"panel.onboarding.winStep3":`3. 如果以前給 node 設過拒絕規則，記得把那條 Block 刪掉；網路類型選「專用」而不是「公用」。`,"panel.onboarding.prompt.intro":`幫我排查一個問題。`,"panel.onboarding.prompt.situation":`我的情況：電腦上裝了 DSH（DeepSeek Harness）的行動端外掛，手機 App 透過區域網路直連連不上這台電腦。`,"panel.onboarding.prompt.address":`手機上填的位址是這台電腦的區域網路位址加連接埠（具體的位址和連接埠你需要到行動端外掛的那個網頁裡看，注意是區域網路位址）。`,"panel.onboarding.prompt.guess":`電腦這邊顯示外掛已經在監聽，但手機連不上。我判斷是電腦的防火牆（或者雲端伺服器的安全群組）把這個連接埠擋了。`,"panel.onboarding.prompt.ask":`請你：`,"panel.onboarding.prompt.ask1":`1. 先確認我的系統是 Linux、macOS 還是 Windows（不確定就問我，或者告訴我怎麼確認）。`,"panel.onboarding.prompt.ask2":`2. 依屬於我這一套的步驟逐條檢查，告訴我那個連接埠現在通不通、卡在哪一步。`,"panel.onboarding.prompt.ask3":`3. 給出具體該執行的命令或點擊路徑，把連接埠放行；需要系統管理員權限的地方明確說明。`,"panel.onboarding.prompt.ask4":`4. 最後告訴我怎麼驗證已經通了（比如用哪條命令從本機、從手機分別確認）。`,"panel.onboarding.prompt.extra":`補充：如果這台電腦是雲端伺服器，服務商主控台裡的安全群組/防火牆也要放行同一個連接埠，這一項在本機查不到。`,"panel.onboarding.relayPlaceholder":`https://你的中轉網域`},en:{"panel.onboarding.title":`Connect your phone to this DSH`,"panel.onboarding.statusFailed":`Could not read plugin status`,"panel.onboarding.stepFailed":`That step did not succeed`,"panel.onboarding.qrAfterRelay":`Once you fill in the relay address below`,"panel.onboarding.qrAfterRelayLine2":`the QR code appears here`,"panel.onboarding.qrAfterAddress":`Once this address connects, the QR code appears here`,"panel.onboarding.noQr":`No QR code yet`,"panel.onboarding.preview":`This preview uses the address you typed. Tapping “Enter plugin” saves it to the configuration.`,"panel.onboarding.relayNotConnected":`The relay is not connected yet; scanning only works once it is.`,"panel.onboarding.direct":`Direct`,"panel.onboarding.thisAddress":`This address`,"panel.onboarding.lanFailed":`Could not start direct connection`,"panel.onboarding.relayFailed":`Relay not connected`,"panel.onboarding.lanErrorWithPort":`{error} (the port may be taken — pick another under “LAN direct” on the main page.)`,"panel.onboarding.lanNoStart":`The direct listener did not start; another program may be holding the port.`,"panel.onboarding.tunnelErrorHint":`{error} (check that the relay address is correct and that the relay is running.)`,"panel.onboarding.tunnelNoStart":`The tunnel did not come up; check the relay address.`,"panel.onboarding.pickAddress":`Which address your phone uses`,"panel.onboarding.relayAddressHint":`Relay address`,"panel.onboarding.recheckSaved":`The relay this machine uses, {url}, is unreachable right now. Check that the relay is running.`,"panel.onboarding.relayNoAnswer":`Nothing is answering at {value}. Check the domain and that dsh-relay is running.`,"panel.onboarding.relayNoAnswerUnsaved":`Nothing is answering at {value}; the configuration was not changed. Check the domain and that dsh-relay is running.`,"panel.onboarding.probe.empty":`No address yet`,"panel.onboarding.probe.busy":`Testing`,"panel.onboarding.probe.ok":`Reachable, not saved yet`,"panel.onboarding.probe.failed":`Unreachable`,"panel.onboarding.probe.idle":`Not tested yet`,"panel.onboarding.probe.okWithHint":`This address is reachable and the QR code was generated from it (not saved to the configuration yet).`,"panel.onboarding.checkFirewall":`Cannot connect? Check the firewall`,"panel.onboarding.lanDirect":`LAN direct`,"panel.onboarding.chooseAddress":`Choose address`,"panel.onboarding.publicRelay":`Public relay`,"panel.onboarding.publicRelayTemporary":`For temporary use`,"panel.onboarding.ownRelay":`Self-hosted relay`,"panel.onboarding.githubRepo":`GitHub repository`,"panel.onboarding.currentLan":`Currently selected LAN address`,"panel.onboarding.public":`Public`,"panel.onboarding.ipv6More":`{count} more IPv6 addresses; your phone picks the fastest`,"panel.onboarding.collapse":`Collapse`,"panel.onboarding.expand":`Expand`,"panel.onboarding.relayListTitle":`Public relay addresses (by measured latency)`,"panel.onboarding.probing":`Measuring…`,"panel.onboarding.autoBest":`Auto (fastest)`,"panel.onboarding.autoBestHint":`Use the fastest one`,"panel.onboarding.probeUnreachable":`Unreachable`,"panel.onboarding.check":`Test`,"panel.onboarding.enterPlugin":`Enter plugin`,"panel.onboarding.connecting":`Connecting…`,"panel.onboarding.fixFirst":`Fix the problems above first`,"panel.onboarding.fillRelayFirst":`Enter the relay address first`,"panel.onboarding.opening":`Opening…`,"panel.onboarding.openDirect":`Open direct connection`,"panel.onboarding.connectRelay":`Connect relay`,"panel.onboarding.firewallTitle":`Check the firewall`,"panel.onboarding.firewallIntro":`When your phone cannot reach this computer’s direct port, the port is usually blocked on the computer. The default direct port is`,"panel.onboarding.firewallIntroTail":` (you can change it under “LAN direct” on the main page). Check it per system below.`,"panel.onboarding.copiedOk":`Copied — paste it into your AI.`,"panel.onboarding.copiedFailed":`Copy failed; select the text and copy it manually.`,"panel.onboarding.gotIt":`Got it`,"panel.onboarding.lanDialogTitle":`Choose a LAN address`,"panel.onboarding.lanDialogHint":`Your phone tries the selected one first and falls back to the rest.`,"panel.onboarding.lanGroupA11y":`LAN addresses`,"panel.onboarding.lan":`LAN`,"panel.onboarding.copyPromptHint":`Tap to copy — let your own AI check it`,"panel.onboarding.copyPrompt":`Copy this troubleshooting prompt`,"panel.onboarding.linuxStep1":`1. Check the firewall status (firewalld or ufw — whichever is installed):`,"panel.onboarding.linuxStep2":`2. Allow the direct port:`,"panel.onboarding.linuxStep3":`3. On a cloud server also allow the same port in your provider’s console security group — it cannot be checked from this machine.`,"panel.onboarding.macStep1":`1. Check whether the application firewall is on:`,"panel.onboarding.macStep2":`2. If it is on, set DSH / node to “Allow incoming connections” under System Settings → Network → Firewall → Options; for troubleshooting you can turn it off entirely:`,"panel.onboarding.macStep3":`3. Still failing on the same Wi-Fi: make sure the phone and computer are really on the same subnet, not a guest network.`,"panel.onboarding.winStep1":`1. In PowerShell (administrator) list the firewall profiles:`,"panel.onboarding.winStep2":`2. Allow the direct port:`,"panel.onboarding.winStep3":`3. If you previously created a block rule for node, delete it; set the network type to Private rather than Public.`,"panel.onboarding.prompt.intro":`Help me troubleshoot a problem.`,"panel.onboarding.prompt.situation":`My situation: I have the DSH (DeepSeek Harness) mobile plugin installed on my computer, and the phone app cannot reach this computer over a direct LAN connection.`,"panel.onboarding.prompt.address":`The address entered on the phone is this computer’s LAN address plus port (you will need to read the exact address and port from the mobile plugin’s web page — note it must be the LAN address).`,"panel.onboarding.prompt.guess":`The computer side shows the plugin is listening, but the phone cannot connect. I believe the computer’s firewall (or a cloud security group) is blocking that port.`,"panel.onboarding.prompt.ask":`Please:`,"panel.onboarding.prompt.ask1":`1. First confirm whether my system is Linux, macOS or Windows (ask me if you are unsure, or tell me how to check).`,"panel.onboarding.prompt.ask2":`2. Walk me through the steps for my setup one by one and tell me whether that port is currently open and where it gets stuck.`,"panel.onboarding.prompt.ask3":`3. Give me the exact commands or click paths to allow the port, and say clearly where administrator rights are needed.`,"panel.onboarding.prompt.ask4":`4. Finally tell me how to verify it works (for example which command to run on the computer and on the phone).`,"panel.onboarding.prompt.extra":`Note: if this computer is a cloud server, the security group or firewall in the provider’s console must allow the same port too, and that cannot be checked locally.`,"panel.onboarding.relayPlaceholder":`https://your-relay.example`},ja:{"panel.onboarding.title":`この DSH にスマートフォンをつなぐ`,"panel.onboarding.statusFailed":`プラグインの状態を取得できません`,"panel.onboarding.stepFailed":`この手順は完了しませんでした`,"panel.onboarding.qrAfterRelay":`下のリレーのアドレスを入力すると`,"panel.onboarding.qrAfterRelayLine2":`ここに QR コードが表示されます`,"panel.onboarding.qrAfterAddress":`このアドレスに接続できると、ここに QR コードが表示されます`,"panel.onboarding.noQr":`QR コードを取得できません`,"panel.onboarding.preview":`入力したアドレスによるプレビューです。「プラグインに入る」を押すとこのアドレスが設定に保存されます。`,"panel.onboarding.relayNotConnected":`リレーにまだ接続していません。接続後にスキャンが有効になります。`,"panel.onboarding.direct":`直結`,"panel.onboarding.thisAddress":`このアドレス`,"panel.onboarding.lanFailed":`直結を開始できませんでした`,"panel.onboarding.relayFailed":`リレーに接続できません`,"panel.onboarding.lanErrorWithPort":`{error}（ポートが使用中の可能性があります。メイン画面の「LAN 直結」で別のポートに変更してください。）`,"panel.onboarding.lanNoStart":`直結が起動しませんでした。別のアプリがポートを使用している可能性があります。`,"panel.onboarding.tunnelErrorHint":`{error}（リレーのアドレスが正しいか、リレーが動いているかを確認してください。）`,"panel.onboarding.tunnelNoStart":`トンネルが確立しませんでした。リレーのアドレスを確認してください。`,"panel.onboarding.pickAddress":`スマートフォンが使うアドレス`,"panel.onboarding.relayAddressHint":`リレーのアドレス`,"panel.onboarding.recheckSaved":`このマシンが使っているリレー {url} に現在つながりません。リレーが動いているか確認してください。`,"panel.onboarding.relayNoAnswer":`リレーのアドレス {value} に応答がありません。ドメイン名と dsh-relay の稼働を確認してください。`,"panel.onboarding.relayNoAnswerUnsaved":`リレーのアドレス {value} に応答がないため、設定は変更していません。ドメイン名と dsh-relay の稼働を確認してください。`,"panel.onboarding.probe.empty":`アドレス未入力`,"panel.onboarding.probe.busy":`確認中`,"panel.onboarding.probe.ok":`接続できます（未保存）`,"panel.onboarding.probe.failed":`接続できません`,"panel.onboarding.probe.idle":`未確認`,"panel.onboarding.probe.okWithHint":`このアドレスに接続できます。QR コードはこのアドレスで生成済みです（設定には未保存）。`,"panel.onboarding.checkFirewall":`つながらない場合はファイアウォールを確認`,"panel.onboarding.lanDirect":`LAN 直結`,"panel.onboarding.chooseAddress":`アドレスを選択`,"panel.onboarding.publicRelay":`共用リレー`,"panel.onboarding.publicRelayTemporary":`一時利用に推奨`,"panel.onboarding.ownRelay":`自前のリレー`,"panel.onboarding.githubRepo":`GitHub リポジトリ`,"panel.onboarding.currentLan":`現在選択中の LAN アドレス`,"panel.onboarding.public":`パブリック`,"panel.onboarding.ipv6More":`ほかに IPv6 アドレスが {count} 件。スマートフォンが実測で選択します`,"panel.onboarding.collapse":`たたむ`,"panel.onboarding.expand":`展開`,"panel.onboarding.relayListTitle":`共用リレーのアドレス（実測の所要時間順）`,"panel.onboarding.probing":`測定中…`,"panel.onboarding.autoBest":`自動（最速）`,"panel.onboarding.autoBestHint":`最も速いものを使用`,"panel.onboarding.probeUnreachable":`到達できません`,"panel.onboarding.check":`確認`,"panel.onboarding.enterPlugin":`プラグインに入る`,"panel.onboarding.connecting":`接続中…`,"panel.onboarding.fixFirst":`まず上の問題を解決してください`,"panel.onboarding.fillRelayFirst":`先にリレーのアドレスを入力`,"panel.onboarding.opening":`開いています…`,"panel.onboarding.openDirect":`直結を開く`,"panel.onboarding.connectRelay":`リレーに接続`,"panel.onboarding.firewallTitle":`ファイアウォールを確認`,"panel.onboarding.firewallIntro":`スマートフォンからこのパソコンの直結ポートにつながらない場合、多くはパソコン側でポートが塞がれています。直結の既定ポートは`,"panel.onboarding.firewallIntroTail":`（メイン画面の「LAN 直結」で変更できます）。以下をシステム別に確認してください。`,"panel.onboarding.copiedOk":`コピーしました。AI に貼り付けてください。`,"panel.onboarding.copiedFailed":`コピーに失敗しました。テキストを選択して手動でコピーしてください。`,"panel.onboarding.gotIt":`了解`,"panel.onboarding.lanDialogTitle":`LAN アドレスを選択`,"panel.onboarding.lanDialogHint":`スマートフォンは選択したものを先に試し、残りは後続の候補になります。`,"panel.onboarding.lanGroupA11y":`LAN アドレス`,"panel.onboarding.lan":`LAN`,"panel.onboarding.copyPromptHint":`クリックでコピー。自分の AI に確認させられます`,"panel.onboarding.copyPrompt":`このトラブルシュート用プロンプトをコピー`,"panel.onboarding.linuxStep1":`1. ファイアウォールの状態を確認（firewalld か ufw、入っている方）:`,"panel.onboarding.linuxStep2":`2. 直結ポートを許可:`,"panel.onboarding.linuxStep3":`3. クラウドサーバーの場合は、事業者コンソールのセキュリティグループでも同じポートを許可してください（このマシンからは確認できません）。`,"panel.onboarding.macStep1":`1. アプリケーションファイアウォールが有効か確認:`,"panel.onboarding.macStep2":`2. 有効な場合は「システム設定 → ネットワーク → ファイアウォール → オプション」で DSH / node を「着信接続を許可」に設定。切り分け時は丸ごと切ることもできます:`,"panel.onboarding.macStep3":`3. 同じ Wi-Fi でもつながらない場合: スマートフォンとパソコンが同じサブネットにあるか（ゲストネットワークでないか）を確認してください。`,"panel.onboarding.winStep1":`1. PowerShell（管理者）でファイアウォールプロファイルを確認:`,"panel.onboarding.winStep2":`2. 直結ポートを許可:`,"panel.onboarding.winStep3":`3. 以前 node に拒否規則を作った場合はそれを削除し、ネットワークの種類を「パブリック」ではなく「プライベート」にしてください。`,"panel.onboarding.prompt.intro":`問題の切り分けを手伝ってください。`,"panel.onboarding.prompt.situation":`状況: パソコンに DSH（DeepSeek Harness）のモバイルプラグインを入れており、スマートフォンのアプリから LAN 直結でこのパソコンにつながりません。`,"panel.onboarding.prompt.address":`スマートフォンに入力したアドレスは、このパソコンの LAN アドレスとポートです（正確なアドレスとポートはモバイルプラグインの Web ページで確認してください。LAN アドレスである点に注意）。`,"panel.onboarding.prompt.guess":`パソコン側ではプラグインが待ち受けていると表示されていますが、スマートフォンからはつながりません。パソコンのファイアウォール（またはクラウドのセキュリティグループ）がこのポートを塞いでいると思います。`,"panel.onboarding.prompt.ask":`お願いします:`,"panel.onboarding.prompt.ask1":`1. まず私の環境が Linux / macOS / Windows のどれかを確認してください（不明なら私に聞くか、確認方法を教えてください）。`,"panel.onboarding.prompt.ask2":`2. 私の環境に合った手順を 1 つずつ確認し、そのポートが今通るのか、どこで止まっているのかを教えてください。`,"panel.onboarding.prompt.ask3":`3. ポートを許可するための具体的なコマンドやクリック手順を示してください。管理者権限が必要な箇所は明記してください。`,"panel.onboarding.prompt.ask4":`4. 最後に、通ったことを確認する方法（パソコン側とスマートフォン側それぞれで実行するコマンドなど）を教えてください。`,"panel.onboarding.prompt.extra":`補足: このパソコンがクラウドサーバーの場合、事業者コンソールのセキュリティグループ／ファイアウォールでも同じポートを許可する必要があり、それはローカルでは確認できません。`,"panel.onboarding.relayPlaceholder":`https://リレーのドメイン`},ko:{"panel.onboarding.title":`이 DSH에 휴대폰 연결하기`,"panel.onboarding.statusFailed":`플러그인 상태를 읽을 수 없습니다`,"panel.onboarding.stepFailed":`이 단계가 완료되지 않았습니다`,"panel.onboarding.qrAfterRelay":`아래에 릴레이 주소를 입력하면`,"panel.onboarding.qrAfterRelayLine2":`여기에 QR 코드가 생성됩니다`,"panel.onboarding.qrAfterAddress":`이 주소에 연결되면 여기에 QR 코드가 생성됩니다`,"panel.onboarding.noQr":`QR 코드를 가져오지 못했습니다`,"panel.onboarding.preview":`입력한 주소로 만든 미리보기입니다. 「플러그인 들어가기」를 눌러야 이 주소가 설정에 저장됩니다.`,"panel.onboarding.relayNotConnected":`릴레이에 아직 연결되지 않았습니다. 연결된 뒤에야 스캔이 동작합니다.`,"panel.onboarding.direct":`직접 연결`,"panel.onboarding.thisAddress":`이 주소`,"panel.onboarding.lanFailed":`직접 연결을 시작하지 못했습니다`,"panel.onboarding.relayFailed":`릴레이에 연결되지 않았습니다`,"panel.onboarding.lanErrorWithPort":`{error} (포트가 사용 중일 수 있습니다. 메인 화면의 「LAN 직접 연결」에서 다른 포트로 바꾸세요.)`,"panel.onboarding.lanNoStart":`직접 연결이 시작되지 않았습니다. 다른 프로그램이 포트를 쓰고 있을 수 있습니다.`,"panel.onboarding.tunnelErrorHint":`{error} (릴레이 주소가 맞는지, 릴레이가 실행 중인지 확인하세요.)`,"panel.onboarding.tunnelNoStart":`터널이 만들어지지 않았습니다. 릴레이 주소를 확인하세요.`,"panel.onboarding.pickAddress":`휴대폰이 사용할 주소`,"panel.onboarding.relayAddressHint":`릴레이 주소`,"panel.onboarding.recheckSaved":`이 컴퓨터가 쓰는 릴레이 {url}에 지금 연결할 수 없습니다. 릴레이가 실행 중인지 확인하세요.`,"panel.onboarding.relayNoAnswer":`릴레이 주소 {value}에서 응답이 없습니다. 도메인과 dsh-relay 실행 여부를 확인하세요.`,"panel.onboarding.relayNoAnswerUnsaved":`릴레이 주소 {value}에서 응답이 없어 설정을 변경하지 않았습니다. 도메인과 dsh-relay 실행 여부를 확인하세요.`,"panel.onboarding.probe.empty":`주소를 아직 입력하지 않았습니다`,"panel.onboarding.probe.busy":`확인 중`,"panel.onboarding.probe.ok":`연결됩니다 (저장 전)`,"panel.onboarding.probe.failed":`연결되지 않습니다`,"panel.onboarding.probe.idle":`아직 확인하지 않았습니다`,"panel.onboarding.probe.okWithHint":`이 주소로 연결됩니다. QR 코드가 이 주소로 생성되었습니다(설정에는 아직 저장되지 않음).`,"panel.onboarding.checkFirewall":`연결되지 않나요? 방화벽을 확인하세요`,"panel.onboarding.lanDirect":`LAN 직접 연결`,"panel.onboarding.chooseAddress":`주소 선택`,"panel.onboarding.publicRelay":`공용 릴레이`,"panel.onboarding.publicRelayTemporary":`임시 사용 권장`,"panel.onboarding.ownRelay":`자가 호스팅 릴레이`,"panel.onboarding.githubRepo":`GitHub 저장소`,"panel.onboarding.currentLan":`현재 선택된 LAN 주소`,"panel.onboarding.public":`공인`,"panel.onboarding.ipv6More":`IPv6 주소가 {count}개 더 있습니다. 휴대폰이 실측으로 선택합니다`,"panel.onboarding.collapse":`접기`,"panel.onboarding.expand":`펼치기`,"panel.onboarding.relayListTitle":`공용 릴레이 주소(실측 지연 순)`,"panel.onboarding.probing":`측정 중…`,"panel.onboarding.autoBest":`자동(가장 빠른 것)`,"panel.onboarding.autoBestHint":`가장 빠른 것을 사용`,"panel.onboarding.probeUnreachable":`연결되지 않음`,"panel.onboarding.check":`확인`,"panel.onboarding.enterPlugin":`플러그인 들어가기`,"panel.onboarding.connecting":`연결 중…`,"panel.onboarding.fixFirst":`위 문제를 먼저 해결하세요`,"panel.onboarding.fillRelayFirst":`릴레이 주소를 먼저 입력하세요`,"panel.onboarding.opening":`여는 중…`,"panel.onboarding.openDirect":`직접 연결 열기`,"panel.onboarding.connectRelay":`릴레이 연결`,"panel.onboarding.firewallTitle":`방화벽 확인`,"panel.onboarding.firewallIntro":`휴대폰에서 이 컴퓨터의 직접 연결 포트로 접속되지 않을 때는 대개 컴퓨터 쪽에서 포트가 막혀 있습니다. 기본 직접 연결 포트는`,"panel.onboarding.firewallIntroTail":` (메인 화면의 「LAN 직접 연결」에서 바꿀 수 있습니다). 아래에서 시스템별로 확인하세요.`,"panel.onboarding.copiedOk":`복사했습니다. AI에 붙여 넣으세요.`,"panel.onboarding.copiedFailed":`복사하지 못했습니다. 텍스트를 선택해 직접 복사하세요.`,"panel.onboarding.gotIt":`확인`,"panel.onboarding.lanDialogTitle":`LAN 주소 선택`,"panel.onboarding.lanDialogHint":`휴대폰은 선택한 주소를 먼저 시도하고 나머지는 뒤에서 대비합니다.`,"panel.onboarding.lanGroupA11y":`LAN 주소`,"panel.onboarding.lan":`LAN`,"panel.onboarding.copyPromptHint":`클릭하여 복사하고 자기 AI에게 확인시키세요`,"panel.onboarding.copyPrompt":`이 문제 진단 프롬프트 복사`,"panel.onboarding.linuxStep1":`1. 방화벽 상태 확인(firewalld 또는 ufw, 설치된 것):`,"panel.onboarding.linuxStep2":`2. 직접 연결 포트 허용:`,"panel.onboarding.linuxStep3":`3. 클라우드 서버라면 사업자 콘솔의 보안 그룹에서도 같은 포트를 허용해야 합니다 — 이 컴퓨터에서는 확인할 수 없습니다.`,"panel.onboarding.macStep1":`1. 애플리케이션 방화벽이 켜져 있는지 확인:`,"panel.onboarding.macStep2":`2. 켜져 있다면 시스템 설정 → 네트워크 → 방화벽 → 옵션에서 DSH / node를 「수신 연결 허용」으로 설정하세요. 진단 중에는 아예 꺼도 됩니다:`,"panel.onboarding.macStep3":`3. 같은 Wi-Fi에서도 안 되면 휴대폰과 컴퓨터가 실제로 같은 서브넷인지(게스트 네트워크가 아닌지) 확인하세요.`,"panel.onboarding.winStep1":`1. PowerShell(관리자)에서 방화벽 프로필 확인:`,"panel.onboarding.winStep2":`2. 직접 연결 포트 허용:`,"panel.onboarding.winStep3":`3. 예전에 node에 차단 규칙을 만들었다면 그 Block 규칙을 삭제하고, 네트워크 종류를 「공용」이 아닌 「전용」으로 설정하세요.`,"panel.onboarding.prompt.intro":`문제 하나를 진단해 주세요.`,"panel.onboarding.prompt.situation":`상황: 컴퓨터에 DSH(DeepSeek Harness) 모바일 플러그인이 설치되어 있고, 휴대폰 앱에서 LAN 직접 연결로 이 컴퓨터에 접속되지 않습니다.`,"panel.onboarding.prompt.address":`휴대폰에 입력한 주소는 이 컴퓨터의 LAN 주소와 포트입니다(정확한 주소와 포트는 모바일 플러그인의 웹 페이지에서 확인해야 하며, LAN 주소여야 합니다).`,"panel.onboarding.prompt.guess":`컴퓨터 쪽에서는 플러그인이 수신 대기 중이라고 표시되지만 휴대폰에서는 접속되지 않습니다. 컴퓨터 방화벽(또는 클라우드 보안 그룹)이 그 포트를 막고 있다고 생각합니다.`,"panel.onboarding.prompt.ask":`요청 사항:`,"panel.onboarding.prompt.ask1":`1. 먼저 제 시스템이 Linux / macOS / Windows 중 무엇인지 확인해 주세요(모르면 저에게 물어보거나 확인 방법을 알려주세요).`,"panel.onboarding.prompt.ask2":`2. 제 환경에 맞는 절차를 하나씩 확인하고, 그 포트가 지금 열려 있는지 어디서 막히는지 알려주세요.`,"panel.onboarding.prompt.ask3":`3. 포트를 허용할 구체적인 명령이나 클릭 경로를 제시하고, 관리자 권한이 필요한 곳은 분명히 알려주세요.`,"panel.onboarding.prompt.ask4":`4. 마지막으로 잘 되는지 확인하는 방법(컴퓨터와 휴대폰에서 각각 실행할 명령 등)을 알려주세요.`,"panel.onboarding.prompt.extra":`참고: 이 컴퓨터가 클라우드 서버라면 사업자 콘솔의 보안 그룹/방화벽에서도 같은 포트를 허용해야 하며, 이는 로컬에서 확인할 수 없습니다.`,"panel.onboarding.relayPlaceholder":`https://릴레이-도메인`}},{"zh-Hans":{"panel.update.title":`插件更新`,"panel.update.unknownVersion":`未知版本`,"panel.update.reading":`正在读更新状态…`,"panel.update.runningVersion":`运行中版本`,"panel.update.diskVersion":`盘上的版本`,"panel.update.latestO
